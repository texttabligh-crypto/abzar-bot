name: Deploy Abzar Bot
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Check connection or deploy latest main
        type: choice
        options: [check, deploy]
        default: check
permissions:
  contents: read
concurrency:
  group: abzar-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Persian PDF font
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run regression tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./tests/test.db
          POSTGRES_PASSWORD: test
          TELEGRAM_BOT_TOKEN: '123:TEST'
          OWNER_TELEGRAM_ID: ''
          REDIS_URL: redis://localhost:6379/15
        run: python -m pytest tests/ -q
  deploy:
    needs: tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Connect using pinned host key and restricted SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          OPERATION: ${{ github.event_name == 'push' && 'deploy' || inputs.operation }}
        shell: bash
        run: |
          set -euo pipefail
          case "$OPERATION" in check|deploy) ;; *) exit 1;; esac
          umask 077
          key="$RUNNER_TEMP/abzar-deploy-key"
          hosts="$RUNNER_TEMP/abzar-known-hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          ssh -i "$key" -p 22 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 \
            root@103.75.196.37 "$OPERATION"
