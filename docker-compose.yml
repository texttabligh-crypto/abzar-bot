services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tradingbot_app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingbot_network

  postgres:
    image: postgres:16-alpine
    container_name: tradingbot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tradingbot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - tradingbot_network

  redis:
    image: redis:7-alpine
    container_name: tradingbot_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - tradingbot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tradingbot_network

volumes:
  tradingbot_postgres_data:
  tradingbot_redis_data:

networks:
  tradingbot_network:
    name: tradingbot_network
